name: Diagnosticar receptor
on:
  push:
    branches: [codex/roadstar-connect-apk]
    paths: ['.github/workflows/mirror-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Roadstar-receptor-emulador
          run-id: 39130030741
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Ler fechamento da sessao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ['sender-sink-report.json','receiver-logcat.txt']:
              p=Path('diagnostics')/filename
              print(filename)
              if filename.endswith('.json'): print(p.read_text()); continue
              lines=p.read_text().splitlines()
              selected=[l for l in lines if any(t in l for t in ['3447','AudioFocus','ActivityTaskManager','WindowManager','PowerManagerService','FocusRequester','AudioPolicyManager'])]
              print('\n'.join(selected[-1400:]))
          PY
